<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Safety Near Miss Report</title>

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   PROFESSIONAL REPORT DESIGN
   ===================================================== */

:root{
    --primary:#123b5d;
    --secondary:#1261a0;
    --light:#f3f6f9;
    --border:#d7dee5;
    --text:#17212b;
}


/* Main report */

.report-paper{
    background:#fff;
    border:1px solid #d5dce2;
    border-radius:12px;
    overflow:hidden;
}


/* Header */

.report-header{
    background:linear-gradient(135deg,#123b5d,#1261a0);
    color:white;
    padding:24px 28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.company-title{
    font-size:25px;
    font-weight:700;
}

.company-subtitle{
    margin-top:5px;
    font-size:13px;
    opacity:.9;
}

.report-title{
    text-align:right;
}

.report-title h1{
    margin:0;
    font-size:24px;
}

.report-title p{
    margin:6px 0 0;
    font-size:13px;
}


/* Report ID */

.report-id-box{
    padding:15px 28px;
    background:#f5f8fa;
    border-bottom:1px solid var(--border);

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.report-id{
    font-size:19px;
    font-weight:700;
    color:var(--primary);
}

.report-date{
    font-size:13px;
    color:#596773;
}


/* Section */

.report-section{
    padding:22px 28px;
    border-bottom:1px solid var(--border);
}

.section-title{
    font-size:16px;
    font-weight:700;
    color:var(--primary);

    border-left:4px solid var(--secondary);

    padding-left:10px;
    margin-bottom:16px;
}


/* Information grid */

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
}

.info-item{
    padding:13px 15px;
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
}

.info-item:nth-child(even){
    border-right:none;
}

.info-label{
    font-size:11px;
    text-transform:uppercase;
    color:#6b7782;
    font-weight:700;
    margin-bottom:4px;
}

.info-value{
    font-size:14px;
    font-weight:600;
}


/* Risk */

.risk{
    display:inline-block;
    padding:6px 15px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

.risk-low{
    background:#dff5e5;
    color:#14652a;
}

.risk-medium{
    background:#fff1c7;
    color:#765500;
}

.risk-high{
    background:#ffe1d6;
    color:#a63200;
}

.risk-critical{
    background:#ffd9df;
    color:#a00024;
}


/* Description boxes */

.detail-box{
    background:#f8fafb;
    border:1px solid var(--border);
    border-radius:8px;
    padding:15px;
    line-height:1.6;
    min-height:50px;
}


/* Evidence */

.evidence-box{
    border:1px solid var(--border);
    border-radius:10px;
    padding:15px;
    background:#fafcfd;
    margin-top:10px;
}

.evidence-title{
    font-weight:700;
    color:var(--primary);
    margin-bottom:12px;
}

.photo-preview{
    display:block;
    width:auto;
    max-width:100%;
    max-height:430px;
    margin:0 auto;
    border-radius:7px;
    border:1px solid #ccd5dc;
}

.video-preview{
    display:block;
    width:100%;
    max-height:400px;
    border-radius:7px;
    background:#000;
}


/* Verification */

.verification-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.signature-box{
    border:1px solid var(--border);
    border-radius:8px;
    padding:15px;
    min-height:85px;
}

.signature-line{
    margin-top:35px;
    border-top:1px solid #777;
    padding-top:5px;
    font-size:11px;
    color:#666;
}


/* Footer */

.report-footer{
    padding:14px 28px;
    background:#f5f7f9;
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:#65727d;
}


/* =====================================================
   SCREEN
   ===================================================== */

.no-print{
    margin-top:18px;
}


/* =====================================================
   PRINT
   ===================================================== */

@page{
    size:A4;
    margin:12mm;
}

@media print{

    html,
    body{
        background:white !important;
        margin:0 !important;
        padding:0 !important;
    }

    body{
        -webkit-print-color-adjust:exact;
        print-color-adjust:exact;
    }

    .wrap{
        max-width:none !important;
        padding:0 !important;
        margin:0 !important;
    }

    .no-print{
        display:none !important;
    }

    .report-paper{
        border:1px solid #aaa;
        border-radius:0;
        box-shadow:none;
    }

    .report-section{
        break-inside:avoid;
    }

    .evidence-box{
        break-inside:avoid;
    }

    .photo-preview{
        max-height:380px;
    }

    .video-preview{
        display:none !important;
    }

    /* Video link/button will NOT print */

    a{
        color:inherit !important;
        text-decoration:none !important;
    }

}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:650px){

    .report-header{
        display:block;
    }

    .report-title{
        text-align:left;
        margin-top:15px;
    }

    .report-id-box{
        display:block;
    }

    .report-date{
        margin-top:6px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

    .info-item{
        border-right:none;
    }

    .verification-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>

<div class="wrap">


<!-- =====================================================
     REPORT
     ===================================================== -->

<div id="report"
     class="report-paper">

</div>


<!-- =====================================================
     SUPERVISOR PANEL
     ===================================================== -->

<div class="card no-print">

<h2>Supervisor Verification</h2>


<label>

Verified By

<input
id="by"
placeholder="Supervisor name">

</label>


<label>

Supervisor Remarks

<textarea
id="remarks"
placeholder="Enter verification remarks"></textarea>

</label>


<button
class="primary"
onclick="verify()">

✅ Verify Report

</button>


<button
onclick="window.print()">

🖨️ Print Report

</button>


<div id="msg"></div>

</div>


</div>


<script>


/* =====================================================
   API
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzqnmmkYRf5kFAn6MPQPbbqfgXhbPcN4oMpZdKL-f2dFa9rtuXaaUmWPPBbo5RalajfTQ/exec";


/* =====================================================
   GET REPORT
   ===================================================== */

const x =
JSON.parse(
localStorage.getItem("nearMissReport") || "null"
);


if(!x){

    location.href="dashboard.html";

}


else{


    /* =================================================
       DATE
       ================================================= */

    let reportDate = "";

    if(x.Timestamp){

        try{

            reportDate =
            new Date(x.Timestamp)
            .toLocaleString();

        }

        catch(e){

            reportDate =
            x.Timestamp;

        }

    }


    /* =================================================
       RISK
       ================================================= */

    let risk =
    x["Risk Level"] || "Not specified";

    let riskClass =
    risk.toLowerCase();


    /* =================================================
       PHOTO
       ================================================= */

    let photoHTML = "";


    if(x["Photo URL"]){

        photoHTML = `

        <div class="report-section">

            <div class="section-title">
                Photo Evidence
            </div>


            <div class="evidence-box">

                <div class="evidence-title">
                    📷 Near Miss Photo
                </div>


                <img
                    class="photo-preview"
                    src="${x["Photo URL"]}"
                    alt="Near Miss Photo"
                    onerror="photoError(this)"
                >


                <div
                    id="photoError"
                    style="
                    display:none;
                    text-align:center;
                    padding:20px;
                    color:#a00000;
                    ">

                    Photo preview is not available.

                </div>

            </div>

        </div>

        `;

    }


    /* =================================================
       VIDEO
       ================================================= */

    let videoHTML = "";


    if(x["Video URL"]){

        videoHTML = `

        <div class="report-section">

            <div class="section-title">
                Video Evidence
            </div>


            <div class="evidence-box">

                <div class="evidence-title">
                    🎥 Near Miss Video
                </div>


                <video
                    class="video-preview"
                    controls
                    preload="metadata">

                    <source
                        src="${x["Video URL"]}">

                </video>


                <div
                    class="video-print-box"
                    style="
                    padding:15px;
                    text-align:center;
                    border:1px dashed #aaa;
                    ">

                    🎥 Video evidence is attached
                    digitally with this report.

                </div>

            </div>

        </div>

        `;

    }


    /* =================================================
       REPORT HTML
       ================================================= */

    report.innerHTML = `


    <!-- HEADER -->

    <div class="report-header">

        <div>

            <div class="company-title">
                MANUFACTURING COMPANY
            </div>

            <div class="company-subtitle">
                Safety / HSE Department
            </div>

        </div>


        <div class="report-title">

            <h1>
                SAFETY NEAR MISS
            </h1>

            <p>
                INCIDENT REPORT
            </p>

        </div>

    </div>



    <!-- REPORT ID -->

    <div class="report-id-box">

        <div>

            <div style="
            font-size:11px;
            color:#687580;
            text-transform:uppercase;
            ">
            Report Identification
            </div>

            <div class="report-id">
                ${x["Report ID"]}
            </div>

        </div>


        <div class="report-date">

            <b>Date & Time</b><br>

            ${reportDate}

        </div>

    </div>



    <!-- EMPLOYEE INFORMATION -->

    <div class="report-section">

        <div class="section-title">
            Employee Information
        </div>


        <div class="info-grid">


            <div class="info-item">

                <div class="info-label">
                    Employee Name
                </div>

                <div class="info-value">
                    ${x["Employee Name"] || "-"}
                </div>

            </div>



            <div class="info-item">

                <div class="info-label">
                    Employee Code
                </div>

                <div class="info-value">
                    ${x["Employee Code"] || "-"}
                </div>

            </div>



            <div class="info-item">

                <div class="info-label">
                    Department
                </div>

                <div class="info-value">
                    ${x.Department || "-"}
                </div>

            </div>



            <div class="info-item">

                <div class="info-label">
                    Designation
                </div>

                <div class="info-value">
                    ${x.Designation || "-"}
                </div>

            </div>



            <div class="info-item">

                <div class="info-label">
                    Location
                </div>

                <div class="info-value">
                    ${x.Location || "-"}
                </div>

            </div>



            <div class="info-item">

                <div class="info-label">
                    Risk Level
                </div>

                <div class="info-value">

                    <span
                    class="risk risk-${riskClass}">

                        ${risk}

                    </span>

                </div>

            </div>


        </div>

    </div>



    <!-- DESCRIPTION -->

    <div class="report-section">

        <div class="section-title">
            Near Miss Description
        </div>

        <div class="detail-box">
            ${x["Near Miss Description"] || "-"}
        </div>

    </div>



    <!-- CONSEQUENCE -->

    <div class="report-section">

        <div class="section-title">
            Potential Consequence
        </div>

        <div class="detail-box">
            ${x["Potential Consequence"] || "-"}
        </div>

    </div>



    <!-- IMMEDIATE ACTION -->

    <div class="report-section">

        <div class="section-title">
            Immediate Action Taken
        </div>

        <div class="detail-box">
            ${x["Immediate Action"] || "-"}
        </div>

    </div>



    ${photoHTML}

    ${videoHTML}



    <!-- VERIFICATION -->

    <div class="report-section">

        <div class="section-title">
            Verification
        </div>


        <div class="verification-grid">


            <div class="signature-box">

                <b>Status</b>

                <br><br>

                ${x.Status || "Pending"}

            </div>



            <div class="signature-box">

                <b>Verified By</b>

                <div class="signature-line">
                    Safety Supervisor
                </div>

            </div>


        </div>

    </div>



    <!-- FOOTER -->

    <div class="report-footer">

        <span>
            Safety / HSE Department
        </span>

        <span>
            Near Miss Reporting System
        </span>

    </div>


    `;

}



/* =====================================================
   PHOTO ERROR
   ===================================================== */

function photoError(img){

    img.style.display="none";

    const error =
    document.getElementById("photoError");

    if(error){

        error.style.display="block";

    }

}



/* =====================================================
   VERIFY
   ===================================================== */

async function verify(){


    const payload = {

        action:"verify",

        reportId:
        x["Report ID"],

        verifiedBy:
        document.getElementById("by").value,

        remarks:
        document.getElementById("remarks").value

    };


    try{


        const r =
        await fetch(

            API_URL,

            {

                method:"POST",

                body:
                JSON.stringify(payload)

            }

        );


        const j =
        await r.json();


        if(j.ok){

            document.getElementById("msg")
            .innerHTML =

            '<div class="success">' +
            '✅ Report verified successfully.' +
            '</div>';

        }

        else{

            document.getElementById("msg")
            .innerHTML =

            '<div class="error">' +
            j.error +
            '</div>';

        }


    }

    catch(error){

        document.getElementById("msg")
        .innerHTML =

        '<div class="error">' +
        'Verification failed: ' +
        error.message +
        '</div>';

    }

}

</script>

</body>

</html>
